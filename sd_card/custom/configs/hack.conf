# Main configuration file for SD customizations.
# Format: strict shell KEY=value lines.

# 0/1 toggles
DUMP_FORCE=0
OFFLINE=1

# 1 = au démarrage, fabrique les fichiers 20 i/s à partir de la caméra si son firmware est le 3.10.78 (MD5 contrôlés)
AUTO_PATCH_FW=1

# Haut-parleur par le LAN (tools/talk) : UDP G.711 µ-law 8 kHz ; TALK_ALLOW (IP unique) est obligatoire
TALK=0
TALK_PORT=5004
TALK_ALLOW=""
TALK_GAIN=50

# Détection de mouvement locale (tools/motion) : publie ON/OFF en MQTT sur MOTION_TOPIC.
# Identifiants du broker dans configs/mqtt.cred (4 lignes : IP, port, utilisateur, mot de passe ; écrit par install.py)
MOTION=0
MOTION_TOPIC="camera/motion"
MOTION_HOLD=30
MOTION_SENS=0
# Filtre humain du firmware (liblvhsr) : 1 = actif, vide = inchangé. Expérimental : voir tools/motion/README.md
MOTION_HUMAN=""

# Bloque le saut d'horloge de +8 h imposé par le firmware (tools/clockfix)
CLOCKFIX=1

# Mute loud factory mode boot voice/beep prompt files.
MUTE_FACTORY_PROMPT=1
MUTE_ALL_SOUNDS=0

# Bind-mount custom hw settings over /usr/local/_ht_hw_settings.ini
OVERRIDE_HW_SETTINGS=1
# Bind-mount custom sw settings over /etc/config/_ht_sw_settings.ini
OVERRIDE_SW_SETTINGS=1

# Backup telnet service, no login required
TELNET=1
TELNET_PORT=24
# 1 = le telnet demande root + le mot de passe du fichier shadow (0 = shell sans mot de passe)
TELNET_LOGIN=0

FTP=0
FTP_PORT=21

# Enable ONVIF stack (lighttpd + wsd_simple_server + onvif_notify_server)
ONVIF=1

# Heure : fuseau POSIX et serveur NTP du LAN (laisser NTP_SERVER vide pour desactiver)
TZ_STRING="CET-1CEST,M3.5.0,M10.5.0/3"
NTP_SERVER=""

# Syslog distant (UDP, "hote:port") et nom d'hote de la camera ; laisser vide pour desactiver
SYSLOG_SERVER=""
CAM_HOSTNAME=""

# Enable SD-provided PTZ helper commands for ONVIF PTZ actions.
ONVIF_PTZ=1
ONVIF_PTZCTL=/tmp/sd/custom/bin/ptzctl

# Save a tail of /var/log/messages to SD logs.
SAVE_SYSLOG=0

# 1 = recentrage materiel de la camera a chaque demarrage (positions absolues fiables)
PTZ_HOME_ON_BOOT=1
