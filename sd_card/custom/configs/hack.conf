# Main configuration file for SD customizations.
# Format: strict shell KEY=value lines.

# 0/1 toggles
DUMP_FORCE=0
OFFLINE=1

# Cadence vidéo : 0 = d'origine (≈15 i/s, tous modèles) ; 1 = 20 i/s (firmware 3.10.78 + capteur SC2336 seulement)
VIDEO_FPS20=0
# Avec VIDEO_FPS20=1 : 1 = fabrique les fichiers 20 i/s sur la caméra (MD5 contrôlés)
AUTO_PATCH_FW=1

# Haut-parleur par le LAN (tools/talk) : UDP G.711 µ-law 8 kHz ; TALK_ALLOW (IP unique) est obligatoire
TALK=0
TALK_PORT=5004
TALK_ALLOW=""
TALK_GAIN=50

# Détection de mouvement locale (tools/motion) : publie ON/OFF en MQTT sur MOTION_TOPIC.
# Identifiants du broker dans configs/mqtt.cred (4 lignes : IP, port, utilisateur, mot de passe ; écrit par install.py)
MOTION=0
MOTION_TOPIC="camera/motion"
MOTION_HOLD=30
MOTION_SENS=0
# Filtre humain du firmware (liblvhsr) : 1 = actif, vide = inchangé. Expérimental : voir tools/motion/README.md
MOTION_HUMAN=""
# Découverte MQTT Home Assistant (tools/gateway, #59) : 1 = entités publiées retained au démarrage, 0 = aucune
HA_DISCOVERY=1
HA_PREFIX="homeassistant"

# Bloque le saut d'horloge de +8 h imposé par le firmware (tools/clockfix)
CLOCKFIX=1

# Mute loud factory mode boot voice/beep prompt files.
MUTE_FACTORY_PROMPT=1
MUTE_ALL_SOUNDS=0

# Bind-mount custom hw settings over /usr/local/_ht_hw_settings.ini
OVERRIDE_HW_SETTINGS=1
# Bind-mount custom sw settings over /etc/config/_ht_sw_settings.ini
OVERRIDE_SW_SETTINGS=1

# Backup telnet service, no login required
TELNET=1
TELNET_PORT=24
# 1 = le telnet demande root + le mot de passe du fichier shadow (0 = shell sans mot de passe)
TELNET_LOGIN=0

FTP=0
FTP_PORT=21

# Enable ONVIF stack (lighttpd + wsd_simple_server + onvif_notify_server)
ONVIF=1

# Heure : fuseau POSIX et serveur NTP du LAN (laisser NTP_SERVER vide pour desactiver)
TZ_STRING="CET-1CEST,M3.5.0,M10.5.0/3"
NTP_SERVER=""

# Syslog distant (UDP, "hote:port") et nom d'hote de la camera ; laisser vide pour desactiver
SYSLOG_SERVER=""
CAM_HOSTNAME=""

# Enable SD-provided PTZ helper commands for ONVIF PTZ actions.
ONVIF_PTZ=1
ONVIF_PTZCTL=/tmp/sd/custom/bin/ptzctl

# Save a tail of /var/log/messages to SD logs.
SAVE_SYSLOG=0

# Journaux de demarrage sur la SD : nombre de demarrages conserves (0 = tout garder).
LOGS_KEEP=20

# 1 = recentrage materiel de la camera a chaque demarrage (positions absolues fiables)
PTZ_HOME_ON_BOOT=1

# Position privee (issue #13) : numero du preset vers lequel privacy.sh envoie la
# camera (0 = desactive). Creer le preset avec ptz_presets.sh ou SetPreset ONVIF,
# voir docs/PRIVACY.md. Une position PTZ ne coupe ni le flux ni le micro.
PRIVACY_PRESET=0

# Protection de la SD : les journaux et la position PTZ restent en RAM (0), 1 = journaux sur la SD.
LOG_TO_SD=0
# 1 = SD montee en ecritures synchrones (evite la FAT corrompue lors d'une coupure de courant).
SD_SYNC=1
# Taille max (Kio) d'un journal en RAM ; au-dela on garde les 300 dernieres lignes.
LOG_RAM_MAX_KB=256
# Copie sur la SD de la fin des journaux toutes les N minutes (0 = jamais).
LOG_SNAPSHOT_MIN=60

# Codec vidéo H.265 (1 = H.265, 0 = H.264 d'origine). Les autres modèles sont déjà en H.265.
VIDEO_H265=1
