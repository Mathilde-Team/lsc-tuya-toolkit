# Exemple de configuration pour install.py.
# Copiez ce fichier en install.yaml, adaptez-le, puis : python3 install.py --config install.yaml
# install.yaml contient des mots de passe : il est ignoré par git, ne le publiez jamais.

# Partition FAT32 de la carte (ex. /dev/sdb1) ou point de montage. Vide = choix dans une liste.
target: ""

network:
  ssid: "MonReseauWifi"              # Wi-Fi 2,4 GHz uniquement
  password: "CHANGE_ME_mot_de_passe_wifi"
  security: 3                        # 1 = ouvert, 2 = WEP, 3 = WPA/WPA2
  dhcp: false                        # false = IP fixe (recommandé, le DHCP est instable sur ce firmware)
  ip: "192.0.2.50"                    # exemple (plage de documentation) : mettez une IP libre de votre LAN, hors plage DHCP
  netmask: "255.255.255.0"
  gateway: "192.0.2.1"

time:
  tz: "CET-1CEST,M3.5.0,M10.5.0/3"   # Europe/Paris, Bruxelles, Amsterdam. Londres : "GMT0BST,M3.5.0/1,M10.5.0"
  ntp_server: ""                     # IP d'un serveur NTP du LAN ; vide = pas de synchronisation

syslog:
  server: ""                         # "hote:port" (UDP) ; vide = désactivé

camera:
  hostname: ""                       # nom d'hôte (utile dans le syslog) ; vide = inchangé
  ptz_home_on_boot: true             # recentrage matériel au démarrage (positions absolues fiables)
  mute_factory_prompt: true
  logs_keep: 20                     # journaux de démarrage conservés sur la SD (0 = tout garder)

onvif:
  enabled: true
  user: "admin"
  password: "auto"                   # "auto" = généré et affiché une fois ; "" = SANS authentification
  ptz: true

services:
  telnet: "open"                     # open = shell root SANS mot de passe (pour régler) ; login = root + security.root_password ; off = coupé
  ftp: false
  offline: true                      # coupe les connexions vers le cloud Tuya

security:
  root_password: "auto"            # mot de passe root (ports telnet 23 et du toolkit en mode login) ; "auto" = généré, affiché une fois

video:
  main_codec: 2                      # 0 = H.264 (~11 i/s mesurées ici), 1 = MJPEG (non testé), 2 = H.265 (20 i/s)
  main_width: 1920                   # plus de 1920x1080 : la caméra a bouclé au redémarrage à 2304x1296
  main_height: 1080
  sub_codec: 2
  sub_width: 640                     # le sous-flux RTSP /sub_ch ne fonctionne pas sur ce firmware (testé)
  sub_height: 360

speaker:
  enabled: false                     # haut-parleur par le LAN (sirène, annonces) ; voir tools/talk/README.md
  allow: ""                          # IP autorisées, séparées par des virgules (ex. Home Assistant) : OBLIGATOIRE si enabled ; port UDP sans authentification
  gain: 50                           # volume 1 à 100
  port: 5004

firmware:
  dump_dir: ""                       # inutile en 3.10.78 (20 i/s fabriqué par la caméra au démarrage) ; pour un autre firmware : dump de VOTRE caméra
