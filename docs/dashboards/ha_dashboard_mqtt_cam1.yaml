                    topic: camera/lullaby/set
                    payload: "4"
              - type: button
                name: "Berceuse 5"
                icon: mdi:music
                tap_action:
                  action: perform-action
                  perform_action: mqtt.publish
                  data:
                    topic: camera/lullaby/set
                    payload: "5"
              - type: button
                name: "Berceuse stop"
                icon: mdi:music-off
                tap_action:
                  action: perform-action
                  perform_action: mqtt.publish
                  data:
                    topic: camera/lullaby/set
